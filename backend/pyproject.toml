[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "gysi-ml"
version = "0.1.0"
description = "Gysi ML Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=15.0",
    "jsonschema>=4.0",
    "scikit-learn>=1.0",
    "matplotlib>=3.8",
    "scipy>=1.10",
    "interpret>=0.7.7",
    "catboost>=1.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=7",
    "pytest-cov",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not slow'"
markers = ["slow: Tests die einen realen Datensatz benötigen (deaktiviert per Default — aktivieren mit: pytest -m slow)"]

[tool.coverage.run]
source = ["gysi_ml"]
