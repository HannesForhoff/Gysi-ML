welcome_message: |
  Willkommen bei Gysi — deinem ML-Assistenten für den Bike-Datensatz! 🚲

  **Was ich kann:**
  - Preprocessing-Schritte konfigurieren (Dedup, Imputation, Encoding, ...)
  - Modelle trainieren (Decision Tree, EBM, CatBoost)
  - Ergebnisse erklären und Runs vergleichen

  **Beispiele:**
  - „Entferne Duplikate und impute fehlende Werte mit Median“
  - „Trainiere einen Decision Tree mit max_depth=5“
  - „Vergleiche Run A mit Run B“

  **Hilfe:** `/help` → Alle Funktionen  |  `/overview` → Datensatz-Überblick  |  `/status` → Session-Status

help:
  full_text: |
    ## Gysi – Hilfeübersicht

    Beschreibe auf Deutsch, was du tun möchtest. Gysi übersetzt deine Anfrage in Aktionsschritte und führt sie aus.
    Du brauchst keine ML-Kenntnisse — einfach natürliche Sprache verwenden.

    ---

    ### Datensatz erkunden

    - **`/overview`** — Zeigt eine statistische Übersicht: Spaltennamen, Datentypen, fehlende Werte und Werteverteilung
    - **`/status`** — Zeigt den aktuellen Stand deiner Pipeline und die Ergebnisse des letzten Runs

    ---

    ### Preprocessing-Schritte

    Diese Schritte bereinigen und transformieren die Rohdaten, bevor ein Modell trainiert werden kann:

    - **Duplikate entfernen** — Entfernt identische Zeilen aus dem Datensatz
    - **Imputation** — Füllt fehlende Werte auf (z. B. mit Median, Mittelwert oder einem festen Wert)
    - **Encoding** — Wandelt Text-Kategorien in Zahlen um, damit Modelle damit arbeiten können
    - **Outlier Handling** — Erkennt und behandelt Ausreißer (z. B. per IQR-Methode)
    - **Correlation Filter** — Entfernt Spalten, die stark miteinander korrelieren (Redundanzreduktion)
    - **Rare Category Bucketing** — Fasst selten vorkommende Kategorien zu einer Sammelgruppe zusammen
    - **Time Features** — Extrahiert neue Spalten aus Zeitstempeln (z. B. Stunde, Wochentag, Monat)

    ---

    ### Modelltraining

    Wichtig: Vor dem Training muss immer ein **Train-Test-Split** durchgeführt werden.
    Dieser teilt die Daten in Trainings- und Testdaten auf, damit das Modell fair bewertet werden kann.

    - **Decision Tree** — Einfaches, gut erklärbares Baummodell; typische Parameter: `max_depth`, `target`
    - **EBM (Explainable Boosting Machine)** — Genaues Modell mit eingebauter Erklärbarkeit
    - **CatBoost Feature Selection** — Ermittelt die wichtigsten Einflussvariablen (Feature Importance)

    ---

    ### Beispielanfragen

    > „Entferne Duplikate und imputiere fehlende Werte in `windspeed` mit dem Median“
    >
    > „Führe einen Train-Test-Split durch“
    >
    > „Trainiere einen Decision Tree mit max_depth=4 auf die Zielspalte cnt“

    ---

    **Grenzen:** Gysi arbeitet ausschließlich mit dem Bike-Sharing-Datensatz.
    Kein Code-Upload, keine externen Daten, kein Deployment.

